name: 24/7 Stock Sentiment Scraper

on:
  workflow_dispatch:
  schedule:
    # Mon-Fri: Pre-Market (09:15 UTC), Open Market (14:45 UTC), Post-Market (21:15 UTC)
    - cron: "15 9 * * 1-5"
    - cron: "45 14 * * 1-5"
    - cron: "15 21 * * 1-5"

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market scraper and Gemini sentiment engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Commit updated report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/latest.json
          git diff --staged --quiet || git commit -m "chore: update market sentiment scan"
          git push
